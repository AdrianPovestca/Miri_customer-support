<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Customer Support — Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0d0e12; --card: #16181d; --border: #24262c;
    --text: #e8e9ec; --muted: #8b8d97; --accent: #6ee7b7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header button {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 12px;
  }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.user { background: var(--card); border: 1px solid var(--border); align-self: flex-end; }
  .msg.assistant { background: #142520; border: 1px solid #244a3a; align-self: flex-start; white-space: pre-wrap; }
  .feedback-row { display: flex; gap: 6px; margin-top: 6px; }
  .feedback-row button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer;
  }
  .feedback-row button.selected { border-color: var(--accent); color: var(--accent); }
  .typing { color: var(--muted); font-size: 13px; align-self: flex-start; padding: 0 14px; }
  form {
    display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-size: 14px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  button[type="submit"] {
    background: var(--accent); color: #0d0e12; border: none; padding: 0 20px;
    border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>🤖 AI Customer Support</h1>
  <button onclick="startNewChat()">New conversation</button>
</header>

<div id="messages"></div>

<form id="chat-form">
  <input type="text" id="input" placeholder="Ask a question... (any language)" autocomplete="off">
  <button type="submit">Send</button>
</form>

<script>
let sessionId = localStorage.getItem('chat_session_id');
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem('chat_session_id', sessionId);
}

const messagesEl = document.getElementById('messages');
const form = document.getElementById('chat-form');
const input = document.getElementById('input');

function addMessage(role, text, responseId) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;

  if (role === 'assistant' && responseId) {
    const feedbackRow = document.createElement('div');
    feedbackRow.className = 'feedback-row';
    feedbackRow.innerHTML = `
      <button data-rating="positive">👍</button>
      <button data-rating="negative">👎</button>
    `;
    feedbackRow.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => submitFeedback(responseId, btn.dataset.rating, feedbackRow);
    });
    el.appendChild(feedbackRow);
  }

  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function submitFeedback(responseId, rating, feedbackRow) {
  feedbackRow.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
  feedbackRow.querySelector(`[data-rating="${rating}"]`).classList.add('selected');
  try {
    await fetch('/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response_id: responseId, rating }),
    });
  } catch (e) {
    console.error('Feedback failed', e);
  }
}

function startNewChat() {
  sessionId = crypto.randomUUID();
  localStorage.setItem('chat_session_id', sessionId);
  messagesEl.innerHTML = '';
  addMessage('assistant', "Hello! 👋 How can I help you today?");
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  input.value = '';

  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.textContent = 'Typing...';
  messagesEl.appendChild(typingEl);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    typingEl.remove();
    addMessage('assistant', data.response, data.response_id);
  } catch (err) {
    typingEl.remove();
    addMessage('assistant', 'Sorry, something went wrong. Please try again.');
  }
});

addMessage('assistant', "Hello! 👋 How can I help you today?");
</script>
</body>
</html>
