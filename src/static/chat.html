<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>miri</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe8;
    --surface: #fbf8f3;
    --surface-user: #ffffff;
    --border: #e2dacb;
    --text: #2a2e29;
    --muted: #8c8375;
    --forest: #16352a;
    --forest-deep: #0e2620;
    --forest-tint: #e7efe9;
    --root: #5c4a30;
    --shadow: 0 4px 20px rgba(22, 53, 42, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 20px 28px 16px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  .wordmark { font-family: 'Playfair Display', serif; font-size: 34px; color: var(--forest); letter-spacing: 1px; display: flex; align-items: baseline; }
  .i-letter { position: relative; display: inline-block; }
  .mark { position: absolute; left: 50%; top: 1px; transform: translateX(-50%); }
  .dot-shape { fill: var(--root); }
  .r1 { stroke-dasharray: 26; stroke-dashoffset: 26; animation: grow 13.5s ease-in-out infinite; animation-delay: 0s; }
  .r2 { stroke-dasharray: 24; stroke-dashoffset: 24; animation: grow 13.5s ease-in-out infinite; animation-delay: 0.15s; }
  .r3 { stroke-dasharray: 24; stroke-dashoffset: 24; animation: grow 13.5s ease-in-out infinite; animation-delay: 0.1s; }
  .r4 { stroke-dasharray: 12; stroke-dashoffset: 12; animation: grow 13.5s ease-in-out infinite; animation-delay: 0.25s; }
  .r5 { stroke-dasharray: 12; stroke-dashoffset: 12; animation: grow 13.5s ease-in-out infinite; animation-delay: 0.2s; }
  .r6 { stroke-dasharray: 10; stroke-dashoffset: 10; animation: grow 13.5s ease-in-out infinite; animation-delay: 0.5s; }
  .r7 { stroke-dasharray: 10; stroke-dashoffset: 10; animation: grow 13.5s ease-in-out infinite; animation-delay: 0.55s; }
  .r8 { stroke-dasharray: 8; stroke-dashoffset: 8; animation: grow 13.5s ease-in-out infinite; animation-delay: 0.6s; }
  @keyframes grow {
    0%, 74% { stroke-dashoffset: var(--len, 26); }
    84% { stroke-dashoffset: 0; }
    91% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: var(--len, 26); }
  }
  header .tagline {
    font-size: 10.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.16em; margin-left: 8px;
  }
  header button {
    background: transparent; color: var(--forest);
    border: 1px solid var(--forest); padding: 7px 16px;
    border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer;
    letter-spacing: 0.02em; transition: all 0.2s ease;
  }
  header button:hover { background: var(--forest); color: var(--surface); }

  #messages {
    flex: 1; overflow-y: auto; padding: 28px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg {
    max-width: 72%; padding: 13px 17px; border-radius: 16px;
    font-size: 14.5px; line-height: 1.6; box-shadow: var(--shadow);
  }
  .msg.user {
    background: var(--surface-user); border: 1px solid var(--border);
    align-self: flex-end; border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    background: var(--forest-tint); border: 1px solid #d3e2d8;
    border-left: 3px solid var(--forest);
    align-self: flex-start; border-bottom-left-radius: 4px;
    white-space: pre-wrap;
  }
  .feedback-row { display: flex; gap: 6px; margin-top: 8px; }
  .feedback-row button {
    background: none; border: 1px solid #cdd9d1; color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 11.5px; cursor: pointer;
    letter-spacing: 0.02em; transition: all 0.15s ease;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .feedback-row button:hover { border-color: var(--forest); color: var(--forest); }
  .feedback-row button.selected { border-color: var(--root); color: var(--root); background: #f2ede3; }
  .feedback-row svg { width: 12px; height: 12px; }

  .typing-bubble {
    align-self: flex-start; background: var(--forest-tint); border: 1px solid #d3e2d8;
    border-left: 3px solid var(--forest); border-bottom-left-radius: 4px;
    border-radius: 16px; padding: 15px 18px; box-shadow: var(--shadow);
    display: flex; gap: 5px; align-items: center;
  }
  .typing-bubble span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--forest);
    opacity: 0.5; animation: pulse 1.2s ease-in-out infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.35; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }

  form {
    display: flex; gap: 10px; padding: 18px 24px;
    border-top: 1px solid var(--border); background: var(--surface);
  }
  input[type="text"] {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 13px 16px; border-radius: 12px; font-size: 14px; font-family: inherit;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { outline: none; border-color: var(--forest); }
  button[type="submit"] {
    background: var(--forest); color: var(--surface); border: none; padding: 0 24px;
    border-radius: 12px; font-weight: 600; font-size: 13.5px; cursor: pointer;
    letter-spacing: 0.03em; transition: background 0.2s ease;
  }
  button[type="submit"]:hover { background: var(--forest-deep); }
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:baseline;">
    <div class="wordmark">
      <span>m</span>
      <span class="i-letter">
        <span>ı</span>
        <svg class="mark" width="14" height="20" viewBox="0 0 26 38">
          <g stroke="#5c4a30" stroke-width="1.4" stroke-linecap="round" fill="none">
            <path class="r1" style="--len:26" d="M13,14 Q12,20 11,25 Q10,29 9,33"/>
            <path class="r2" style="--len:24" d="M13,14 Q8,18 6,23 Q5,27 3,30"/>
            <path class="r3" style="--len:24" d="M13,14 Q18,17 20,22 Q21,26 23,29"/>
            <path class="r4" style="--len:12" d="M13,14 Q10,17 8,20"/>
            <path class="r5" style="--len:12" d="M13,14 Q16,16 18,19"/>
            <path class="r6" style="--len:10" stroke-width="1" d="M11,22 Q8,24 6,26"/>
            <path class="r7" style="--len:10" stroke-width="1" d="M19,23 Q22,25 24,27"/>
            <path class="r8" style="--len:8" stroke-width="0.8" d="M10,26 Q8,28 7,30"/>
          </g>
          <circle class="dot-shape" cx="13" cy="6" r="5"/>
        </svg>
      </span>
      <span>r</span>
      <span>i</span>
    </div>
    <span class="tagline">Customer Support</span>
  </div>
  <button onclick="startNewChat()">New conversation</button>
</header>

<div id="messages"></div>

<form id="chat-form">
  <input type="text" id="input" placeholder="How may I help you today?" autocomplete="off">
  <button type="submit">Send</button>
</form>

<script>
let sessionId = localStorage.getItem('chat_session_id');
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem('chat_session_id', sessionId);
}

const messagesEl = document.getElementById('messages');
const form = document.getElementById('chat-form');
const input = document.getElementById('input');

function addMessage(role, text, responseId) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;

  if (role === 'assistant' && responseId) {
    const feedbackRow = document.createElement('div');
    feedbackRow.className = 'feedback-row';
    feedbackRow.innerHTML = `
      <button data-rating="positive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Helpful
      </button>
      <button data-rating="negative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        Not helpful
      </button>
    `;
    feedbackRow.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => submitFeedback(responseId, btn.dataset.rating, feedbackRow);
    });
    el.appendChild(feedbackRow);
  }

  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function submitFeedback(responseId, rating, feedbackRow) {
  feedbackRow.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
  feedbackRow.querySelector(`[data-rating="${rating}"]`).classList.add('selected');
  try {
    await fetch('/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response_id: responseId, rating }),
    });
  } catch (e) {
    console.error('Feedback failed', e);
  }
}

function startNewChat() {
  sessionId = crypto.randomUUID();
  localStorage.setItem('chat_session_id', sessionId);
  messagesEl.innerHTML = '';
  addMessage('assistant', "Hello, and welcome. How may I assist you today?");
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  input.value = '';

  const typingEl = document.createElement('div');
  typingEl.className = 'typing-bubble';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(typingEl);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    typingEl.remove();
    addMessage('assistant', data.response, data.response_id);
  } catch (err) {
    typingEl.remove();
    addMessage('assistant', 'Sorry, something went wrong. Please try again.');
  }
});

addMessage('assistant', "Hello, and welcome. How may I assist you today?");
</script>
</body>
</html>
