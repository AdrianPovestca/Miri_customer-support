# docker-compose.yml — convenience wrapper around the Dockerfile.
# Run with: docker compose up --build
#
# Uses your local .env file for secrets (never baked into the image itself),
# and persists the vector index (chroma_db) outside the container so it
# survives restarts and rebuilds.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped